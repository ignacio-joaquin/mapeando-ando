name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxis de Python
        run: python -m py_compile pipeline/*.py api/*.py
      - name: Configs de sitios válidas
        run: for f in sites/*.json; do python -m json.tool "$f" > /dev/null; done
      - name: Scripts de deploy
        run: bash -n deploy/*.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (typecheck + vite)
        run: npm run build
