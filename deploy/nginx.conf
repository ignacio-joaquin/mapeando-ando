server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Frontend estático (web/). Cuando haya build de React, apuntar a web/dist.
    root /opt/mapeando-ando/web;
    index index.html;

    # Salidas precomputadas (tiles, JSON) que genera el pipeline
    location /tiles/ {
        alias /data/output/;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
