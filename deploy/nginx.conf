server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Frontend compilado (deploy/build-web.sh publica cada build y mueve este symlink)
    root /var/www/mapeando/current;
    index index.html;

    # Salidas precomputadas (tiles, JSON) que genera el pipeline
    location /tiles/ {
        alias /data/output/;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
        # El mime.types de nginx 1.24 no conoce .geojson ni .pbf (tiles vectoriales de las
        # curvas): salen como octet-stream y quedan fuera de gzip. Un bloque types reemplaza
        # TODA la lista de esta location: por eso se declara cada tipo que sirve el pipeline,
        # no solo el que faltaba.
        types {
            application/json json;
            application/geo+json geojson;
            application/x-protobuf pbf;
            image/png png;
            image/jpeg jpg jpeg;
            image/tiff tif tiff;
            text/csv csv;
            text/plain txt;
        }
        # Los índices del pipeline (places.json pesa MB en Gale, coverage y curvas también)
        # y los tiles vectoriales se repiten mucho: gzip los achica ~8 veces. PNG y COG ya
        # vienen comprimidos. Los .pbf se escriben sin comprimir a propósito: MapLibre no lee
        # un .pbf gzipeado si no viene con Content-Encoding, que es lo que pone nginx acá.
        gzip on;
        gzip_types application/json application/geo+json application/x-protobuf;
        gzip_min_length 1024;
        gzip_vary on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Assets con hash del build: cache largo. Los .mjs (worker de MapLibre) tienen que
    # salir como JavaScript: el mime.types de nginx 1.24 no los conoce y los manda como
    # octet-stream, y el navegador bloquea un módulo con ese tipo.
    location /assets/ {
        types {
            application/javascript js mjs;
            text/css css;
        }
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
